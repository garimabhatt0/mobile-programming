<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beakon — Journey</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <p class="page-header"><i class="ti ti-route"></i> My Journey</p>

      <!-- TRIP FORM -->
      <input
        type="text"
        class="input-field"
        id="tripName"
        placeholder="Trip name e.g. Mustang Adventure"
      />
      <div style="display: flex; gap: 10px">
        <input type="date" class="input-field" id="startDate" style="flex: 1" />
        <input type="date" class="input-field" id="endDate" style="flex: 1" />
      </div>

      <p class="section-title" style="margin-top: 8px">Itinerary</p>

      <!-- STEPS -->
      <div id="itineraryList">
        <div class="step-card">
          <div class="step-num">1</div>
          <div class="dest-info">
            <h3>Kathmandu → Jomsom</h3>
            <p>Flight · 35 min</p>
          </div>
        </div>
        <div class="step-card">
          <div class="step-num">2</div>
          <div class="dest-info">
            <h3>Lo Manthang</h3>
            <p>Explore · 2 days</p>
          </div>
        </div>
        <div class="step-card">
          <div class="step-num">3</div>
          <div class="dest-info">
            <h3>Tiji Festival</h3>
            <p>Cultural Event · 3 days</p>
          </div>
        </div>
      </div>

      <!-- ADD STOP -->
      <div style="display: flex; gap: 10px; margin-top: 8px">
        <input
          type="text"
          class="input-field"
          id="newStop"
          placeholder="Add a stop..."
          style="flex: 1; margin: 0"
        />
        <button
          onclick="addStop()"
          style="
            background: var(--gold);
            color: #1a1a2e;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
          "
        >
          Add
        </button>
      </div>

      <!-- SAVE BUTTON -->
      <button
        onclick="saveTrip()"
        style="
          width: 100%;
          margin-top: 16px;
          background: var(--gold);
          color: #1a1a2e;
          border: none;
          border-radius: 12px;
          padding: 14px;
          font-size: 14px;
          font-weight: 700;
          cursor: pointer;
        "
      >
        💾 Save Trip to Firebase
      </button>

      <p
        id="saveMsg"
        style="
          text-align: center;
          color: #4ecba0;
          font-size: 13px;
          margin-top: 10px;
        "
      ></p>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
      <a href="index.html" class="nav-item">
        <i class="ti ti-home"></i>
        <span>Home</span>
      </a>
      <a href="explore.html" class="nav-item">
        <i class="ti ti-map-pin"></i>
        <span>Explore</span>
      </a>
      <a href="nearby.html" class="nav-item">
        <i class="ti ti-current-location"></i>
        <span>Nearby</span>
      </a>
      <a href="journey.html" class="nav-item active">
        <i class="ti ti-route"></i>
        <span>Journey</span>
      </a>
      <a href="guides.html" class="nav-item">
        <i class="ti ti-users"></i>
        <span>Guides</span>
      </a>
      <a href="sos.html" class="nav-item">
        <i class="ti ti-sos"></i>
        <span>SOS</span>
      </a>
    </nav>

    <script src="js/firebase.js" type="module"></script>
    <script src="js/journey.js" type="module"></script>
  </body>
</html>
